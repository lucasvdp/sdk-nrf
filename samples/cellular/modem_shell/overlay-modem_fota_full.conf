# Decrease buffer to make it work with minimal TF-M.
CONFIG_NRF_CLOUD_FOTA_FULL_MODEM_UPDATE_BUF_SIZE=1024
CONFIG_TFM_LOG_LEVEL_SILENCE=y

# Decrease TF-M SRAM and flash sizes because there's a lot of unused memory
CONFIG_PM_PARTITION_SIZE_TFM_SRAM=0xC000
CONFIG_PM_PARTITION_SIZE_TFM=0x18000

# Full modem FOTA
CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_STREAM=y
CONFIG_DFU_TARGET_FULL_MODEM=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
CONFIG_ZCBOR=y
CONFIG_STREAM_FLASH_ERASE=y
CONFIG_STREAM_FLASH=y
CONFIG_FMFU_FDEV=y
CONFIG_DOWNLOADER_STACK_SIZE=2560
